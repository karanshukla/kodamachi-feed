; Two processes, one container.
;
; PHP cannot hold the Jetstream socket open across web requests, so the
; collector has to be its own process. It is kept in the same container
; because the two share a SQLite file, and a platform volume attaches to a
; single service: splitting them would mean splitting the database too.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; So `supervisorctl status` works inside a running container: without these
; sections there is no way to ask whether the collector is actually up, and a
; container serving HTTP with a dead collector looks perfectly healthy.
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
; Colon, not a dot, before the factory name. Supervisor 4.2 resolves this
; through pkg_resources, and setuptools 78 reads a fully dotted spec as a
; module path -- so the documented `...rpcinterface.make_main_rpcinterface`
; form fails at boot with "cannot be resolved".
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:web]
command=frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:collector]
command=php /app/tempest posts:collect
directory=/app
autorestart=true
; The subscription reconnects on its own; a restart here means the process
; itself died, which is worth retrying but not worth thrashing over.
startsecs=10
startretries=10
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
